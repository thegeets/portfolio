<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="gpFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151C" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>
    <linearGradient id="gpFavAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="gpFavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#gpFavBg)" stroke="url(#gpFavAccent)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Monogram GP Geometric Mark -->
  <g filter="url(#gpFavGlow)">
    <!-- Letter G -->
    <path 
      d="M 23 15 H 16 A 8 8 0 0 0 16 33 H 23 V 24 H 18.5" 
      stroke="url(#gpFavAccent)" 
      stroke-width="3.6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Letter P -->
    <path 
      d="M 26.5 33 V 15 H 32.5 A 4.5 4.5 0 0 1 32.5 24 H 26.5" 
      stroke="#F5F5F7" 
      stroke-width="3.6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>